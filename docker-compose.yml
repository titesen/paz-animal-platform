version: "3.8"

services:
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: paz_animal_postgres_db
    ports:
      - "5432:5432"
    env_file:
      - .env.docker
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      # - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql  # Commented: Using Drizzle migrations instead
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - paz_animal_network

  # Interfaz de Administración Gráfica pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: paz_animal_pgadmin_gui
    ports:
      - "5050:80"
    env_file:
      - .env.docker
    depends_on:
      db:
        condition: service_healthy
    networks:
      - paz_animal_network

networks:
  paz_animal_network:
    driver: bridge
